<!doctype html><html lang="fa" dir="rtl"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="stylesheet" href="/styles.css"><link rel="stylesheet" href="/panel.css"><title>پنل مدیریت | VPPRV1</title></head><body class="panel-body"><section id="auth" class="auth-wrap"><form id="loginForm" class="auth-card"><span class="mark">V</span><h1>ورود به پنل</h1><p>مدیریت امن زیرساخت VPPRV1</p><label>ایمیل<input name="email" type="email" required autocomplete="username"></label><label>رمز عبور<input name="password" type="password" minlength="12" required autocomplete="current-password"></label><button class="primary-btn">ورود امن</button><button type="button" id="bootstrapBtn" class="link-btn">راه‌اندازی اولین مدیر</button><small id="authMsg"></small></form></section><div id="dashboard" hidden><aside><div class="brand"><span class="mark">V</span><b>VPPRV1</b></div><nav id="sideNav"><button class="active" data-page="dashboard">◫ داشبورد</button><button data-page="servers">◉ سرورها</button><button data-page="nodes">⌁ نودها</button><button data-page="configs">◇ کانفیگ‌ها</button><button data-page="users">♙ کاربران</button><button data-page="subscriptions">◈ اشتراک‌ها</button><button data-page="releases">⇩ نسخه‌ها</button></nav><button id="logout">خروج از حساب</button></aside><main class="admin-main"><header><div><small>مرکز کنترل</small><h2 id="pageTitle">داشبورد</h2></div><span class="online">● سرویس آنلاین</span></header><section id="content"></section></main></div><dialog id="serverDialog"><form id="serverForm"><h2>افزودن سرور</h2><div class="form-grid"><label>نام<input name="name" required></label><label>کشور<input name="country" required></label><label>شهر<input name="city" required></label><label>Host / IP<input name="host" required dir="ltr"></label><label>پورت<input name="port" type="number" value="51820"></label><label>کلید عمومی<input name="public_key" dir="ltr"></label><label>وضعیت<select name="status"><option value="inactive">غیرفعال</option><option value="active">فعال</option><option value="maintenance">نگهداری</option></select></label></div><div class="dialog-actions"><button type="button" onclick="this.closest('dialog').close()">انصراف</button><button class="primary-btn">ذخیره</button></div></form></dialog><script type="module" src="/panel.js"></script></body></html>
